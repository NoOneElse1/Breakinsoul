<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BREAKIN SOULS — V8 NIGHT FAST</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#03050a;font-family:Arial,Helvetica,sans-serif}
canvas{display:block}
#ui{position:fixed;inset:0;z-index:20;pointer-events:none;color:#f1f1f1}
#gate{position:absolute;inset:0;background:#03050a;display:flex;align-items:center;justify-content:center;pointer-events:auto;transition:.5s}
#gate .box{text-align:center;padding:24px}
#gate h1{margin:0;color:#b80d19;font-size:clamp(48px,9vw,108px);letter-spacing:.03em;text-shadow:0 0 26px rgba(184,13,25,.3)}
#gate p{font-size:clamp(22px,4vw,44px);color:#6ebf35;font-weight:900;margin:10px 0 24px;font-family:'Segoe Print','Comic Sans MS','Trebuchet MS',cursive;letter-spacing:.03em;transform:rotate(1.2deg);text-shadow:2px 2px 0 #141414,-1px -1px 0 #325c1d}
#enter{pointer-events:auto;background:transparent;border:2px solid #eee;color:#eee;padding:14px 26px;font-weight:900;letter-spacing:.17em;cursor:pointer}
#hud{position:absolute;left:14px;top:14px;font-size:12px;font-weight:900;letter-spacing:.14em}
#track{position:absolute;left:50%;top:5%;transform:translateX(-50%);opacity:0;transition:.2s;text-align:center;background:rgba(3,5,10,.72);border:1px solid #888;padding:8px 12px}
#track b{display:block;color:#ff5964;font-size:30px}
#track span{font-size:11px;letter-spacing:.15em}
#prompt{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);opacity:0;background:rgba(3,5,10,.82);border:1px solid #888;padding:8px 11px;font-weight:900}
#help{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:11px;font-weight:900;letter-spacing:.1em;text-align:center}
#cross{position:absolute;left:50%;top:50%;width:7px;height:7px;border:1.5px solid #ddd;border-radius:50%;transform:translate(-50%,-50%)}
#place{position:absolute;right:14px;top:14px;font-size:12px;font-weight:900;letter-spacing:.13em;text-align:right}

#gate .box{position:relative}
#gate .box:before,#gate .box:after{
content:"";position:absolute;left:10%;right:10%;height:8px;border-radius:50%;
background:repeating-linear-gradient(90deg,#b70f1a 0 13px,transparent 13px 19px,#6ebf35 19px 33px,transparent 33px 39px);
opacity:.7;transform:rotate(-2deg)
}
#gate .box:before{top:-18px}
#gate .box:after{bottom:-8px;transform:rotate(2deg)}
#gate h1,#gate p{animation:scribble 2.8s steps(2,end) infinite}
@keyframes scribble{
0%,100%{filter:drop-shadow(0 0 0 rgba(0,0,0,0));}
50%{filter:drop-shadow(1px 0 0 rgba(255,255,255,.15));}
}

body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:30;opacity:.045;
  background-image:
    repeating-linear-gradient(13deg,rgba(255,255,255,.35) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(-19deg,rgba(0,0,0,.28) 0 1px,transparent 1px 5px);
  mix-blend-mode:overlay;
}
#enter{
  transform:rotate(-1deg);
  font-family:'Segoe Print','Comic Sans MS',cursive;
  box-shadow:2px 3px 0 rgba(255,255,255,.12),-2px -2px 0 rgba(183,15,26,.2);
}
</style>
</head>

<div id="ui">

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x010207);
scene.fog=new THREE.FogExp2(0x02030a,.0078);

const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.1,420);
camera.position.set(0,2.7,16);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x314260,0x070509,.38));
const moonLight=new THREE.DirectionalLight(0x9cb5ff,1.05);
moonLight.intensity=.9;moonLight.position.set(-18,26,12);scene.add(moonLight);

function crayon(hex,seed=1){
  const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');
  x.fillStyle=hex;x.fillRect(0,0,256,256);
  let s=seed*917+19;const r=()=>((s=(s*9301+49297)%233280)/233280);
  for(let i=0;i<190;i++){x.strokeStyle=`rgba(0,0,0,${.035+r()*.16})`;x.lineWidth=.6+r()*3.5;x.beginPath();x.moveTo(r()*256,r()*256);x.lineTo(r()*256,r()*256);x.stroke()}
  for(let i=0;i<90;i++){x.strokeStyle=`rgba(255,255,255,${.018+r()*.07})`;x.lineWidth=.5+r()*2;x.beginPath();x.moveTo(r()*256,r()*256);x.lineTo(r()*256,r()*256);x.stroke()}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function labelTex(txt,col='#eee'){
  const c=document.createElement('canvas');c.width=512;c.height=150;const x=c.getContext('2d');x.clearRect(0,0,512,150);
  x.font='bold 56px Arial';x.textAlign='center';x.textBaseline='middle';x.fillStyle=col;x.fillText(txt,256,75);
  for(let i=0;i<22;i++){x.strokeStyle=i%2?'#b30c17':'#ddd';x.lineWidth=2+Math.random()*3;x.beginPath();x.moveTo(Math.random()*512,Math.random()*150);x.lineTo(Math.random()*512,Math.random()*150);x.stroke()}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

// STARS
const starGeo=new THREE.BufferGeometry(),starPts=[];
for(let i=0;i<1100;i++){
  const radius=170+Math.random()*170;
  const a=Math.random()*Math.PI*2;
  const y=30+Math.random()*150;
  starPts.push(Math.cos(a)*radius,y,Math.sin(a)*radius-70);
}
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPts,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:.6,sizeAttenuation:true,transparent:true,opacity:.95}));
scene.add(stars);

// MOON + glow
const moon=new THREE.Mesh(new THREE.SphereGeometry(6.3,40,40),new THREE.MeshBasicMaterial({color:0xf1f4ff}));
moon.position.set(-78,76,-145);scene.add(moon);
const moonGlow=new THREE.PointLight(0x9bb6ff,2.6,160);moonGlow.position.copy(moon.position);scene.add(moonGlow);

const street=new THREE.Group();scene.add(street);
const interior=new THREE.Group();scene.add(interior);interior.visible=false;

const groundTex=crayon('#13131a',7);groundTex.wrapS=groundTex.wrapT=THREE.RepeatWrapping;groundTex.repeat.set(15,28);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,210),new THREE.MeshStandardMaterial({map:groundTex,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.z=-68;street.add(ground);

function road(x,z,w,d){
  const t=crayon('#202127',Math.round(x+z+200));t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,18);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshStandardMaterial({map:t,roughness:1}));
  m.rotation.x=-Math.PI/2;m.position.set(x,.02,z);street.add(m);
  return m;
}
road(0,-62,24,180);
road(0,-35,122,18);
road(0,-88,122,18);

// ROAD MARKINGS
for(let z=15;z>-158;z-=8){
  const dash=new THREE.Mesh(new THREE.PlaneGeometry(.22,3.8),new THREE.MeshBasicMaterial({color:0xe6d25a}));
  dash.rotation.x=-Math.PI/2;dash.position.set(0,.028,z);street.add(dash);
}
for(const x of [-5.5,5.5]){
  const edge=new THREE.Mesh(new THREE.PlaneGeometry(.12,176),new THREE.MeshBasicMaterial({color:0xd7d7d7}));
  edge.rotation.x=-Math.PI/2;edge.position.set(x,.03,-62);street.add(edge);
}

const data=[
 ["A FATHER\'S SHADOW",-18,4,"#4b207d"],['NUMB AGAIN',18,-11,'#9c4512'],['CHASING THE NIGHT',-18,-29,'#174f8f'],
 ['BEAUTIFUL POISON',18,-48,'#91265f'],['BROKEN SOUL',-18,-66,'#8c7e12'],['THE AWAKENING OF CONSCIOUSNESS',18,-78,'#0d5b4d'],
 ['WHEN YOU FOUND ME',-18,-98,'#8a3020'],['RECONSTRUCTION',18,-110,'#3b368a'],['THE DAY I BECAME HOME',-18,-130,'#405b1e'],['HEAVEN',18,-145,'#81254f']
];
const buildings=[];
data.forEach((d,i)=>{
  const w=10,h=12+(i%3)*2.2,dep=9,tex=crayon(d[3],i+1);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(1,2);
  const g=new THREE.Group();
  const box=new THREE.Mesh(new THREE.BoxGeometry(w,h,dep),new THREE.MeshStandardMaterial({map:tex,roughness:1}));box.position.y=h/2;g.add(box);
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry),new THREE.LineBasicMaterial({color:0x050505}));edges.position.copy(box.position);g.add(edges);
  const sign=new THREE.Mesh(new THREE.PlaneGeometry(7.2,1.45),new THREE.MeshBasicMaterial({map:labelTex(d[0]),transparent:true}));sign.position.set(0,2.2,4.53);g.add(sign);
  for(let y=4.2;y<h-1;y+=2.4)for(let x=-3.8;x<3.9;x+=1.7){
    const lit=Math.random()>.2;
    const p=new THREE.Mesh(new THREE.PlaneGeometry(.82,.95),new THREE.MeshBasicMaterial({color:lit?0xffc648:0x101116}));
    p.position.set(x,y,4.54);g.add(p);
    if(lit&&Math.random()>.72){const pl=new THREE.PointLight(0xffb13d,.45,5);pl.position.set(x,y,4.9);g.add(pl)}
  }
  const door=new THREE.Mesh(new THREE.PlaneGeometry(1.7,2.6),new THREE.MeshBasicMaterial({color:0x08090c}));door.position.set(0,1.3,4.56);g.add(door);
  g.position.set(d[1],0,d[2]);g.userData={name:d[0],index:i,color:d[3]};street.add(g);buildings.push(g);
});

// STREET LIGHTS
const lamps=[];
for(let z=10,idx=0;z>-156;z-=12,idx++){
  for(const x of [-7.4,7.4]){
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,7,8),new THREE.MeshStandardMaterial({color:0x292a31}));
    pole.position.set(x,3.5,z);street.add(pole);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(1.35,.09,.09),new THREE.MeshStandardMaterial({color:0x292a31}));
    arm.position.set(x+(x<0?.62:-.62),6.72,z);street.add(arm);

    const bulb=new THREE.Mesh(new THREE.SphereGeometry(.13,10,10),new THREE.MeshBasicMaterial({color:0xffd078}));
    bulb.position.set(bx,6.56,z);street.add(bulb);
    const L=new THREE.PointLight(0xffc45f,2.6,16,2);L.position.copy(bulb.position);street.add(L);
    lamps.push({L,bulb,phase:Math.random()*10,flicker:idx%4===0});
  }
}


function createFace(skin=0x8c5b3e, emotion='neutral'){
  const head=new THREE.Group();
  const skull=new THREE.Mesh(new THREE.SphereGeometry(.22,18,18),new THREE.MeshStandardMaterial({color:skin}));
  head.add(skull);

  const dark=new THREE.MeshBasicMaterial({color:0x111111});
  const browMat=new THREE.MeshBasicMaterial({color:0x1b120d});

  [-.075,.075].forEach((x,i)=>{
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.019,8,8),dark);
    eye.position.set(x,.035,.205);head.add(eye);

    const brow=new THREE.Mesh(new THREE.BoxGeometry(.085,.015,.012),browMat);
    brow.position.set(x,.092,.208);
    if(emotion==='angry') brow.rotation.z=i===0?-.28:.28;
    if(emotion==='sad') brow.rotation.z=i===0?.25:-.25;
    if(emotion==='scared') brow.position.y=.12;
    head.add(brow);
  });

  const mouthMat=new THREE.MeshBasicMaterial({color:0x1a0f0d});
  let mouth;
  if(emotion==='happy'){
    const curve=new THREE.CurvePath();
    curve.add(new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(-.055,-.045,.215),
      new THREE.Vector3(0,-.085,.225),
      new THREE.Vector3(.055,-.045,.215)
    ));
    mouth=new THREE.Mesh(new THREE.TubeGeometry(curve,10,.006,5,false),mouthMat);
  }else if(emotion==='sad'){
    const curve=new THREE.CurvePath();
    curve.add(new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(-.055,-.075,.215),
      new THREE.Vector3(0,-.035,.225),
      new THREE.Vector3(.055,-.075,.215)
    ));
    mouth=new THREE.Mesh(new THREE.TubeGeometry(curve,10,.006,5,false),mouthMat);
  }else if(emotion==='scared'){
    mouth=new THREE.Mesh(new THREE.RingGeometry(.022,.035,12),mouthMat);
    mouth.position.set(0,-.062,.218);
  }else{
    mouth=new THREE.Mesh(new THREE.BoxGeometry(.085,.012,.01),mouthMat);
    mouth.position.set(0,-.065,.217);
  }
  if(!mouth.position.z) mouth.position.z=.217;
  head.add(mouth);

  const nose=new THREE.Mesh(new THREE.ConeGeometry(.017,.055,6),new THREE.MeshStandardMaterial({color:skin}));
  nose.rotation.x=Math.PI/2;nose.position.set(0,-.005,.218);head.add(nose);
  head.userData.emotion=emotion;
  return head;
}
function human(color=0x333333,skin=0x8c5b3e,emotion='neutral'){
  const g=new THREE.Group();
  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.24,.72,5,10),new THREE.MeshStandardMaterial({color}));torso.position.y=1.35;g.add(torso);
  const head=createFace(skin,emotion);head.position.y=2.0;g.add(head);g.userData.head=head;g.userData.emotion=emotion;
  const limbMat=new THREE.MeshStandardMaterial({color});
  function limb(len=.72){return new THREE.Mesh(new THREE.CapsuleGeometry(.075,len-.18,4,8),limbMat)}
  const la=limb(),ra=limb(),ll=limb(.82),rl=limb(.82);
  la.position.set(-.34,1.5,0);ra.position.set(.34,1.5,0);ll.position.set(-.15,.65,0);rl.position.set(.15,.65,0);
  g.add(la,ra,ll,rl);g.userData={la,ra,ll,rl,phase:Math.random()*10};return g;
}
function animateWalk(h,time,speed=1){
  const p=time*6*speed+h.userData.phase;
  h.userData.la.rotation.x=Math.sin(p)*.55;h.userData.ra.rotation.x=-Math.sin(p)*.55;
  h.userData.ll.rotation.x=-Math.sin(p)*.55;h.userData.rl.rotation.x=Math.sin(p)*.55;
}
const walkers=[];
for(let i=0;i<30;i++){
  const h=human([0x272727,0x6b2f4f,0x315d3d,0x6b4d2d,0x354f7c][i%5]);
  const side=Math.random()>.5?1:-1;h.position.set(side*(7.7+Math.random()*5.7),0,12-Math.random()*165);
  h.userData.speed=.7+Math.random();h.userData.dir=Math.random()>.5?1:-1;street.add(h);walkers.push(h);
}

function carBody(color=0x444444){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.25,.62,4.4),new THREE.MeshStandardMaterial({color,metalness:.2,roughness:.55}));body.position.y=.62;g.add(body);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.78,.72,1.85),new THREE.MeshStandardMaterial({color}));cabin.position.set(0,1.25,-.25);g.add(cabin);
  const glass=new THREE.MeshStandardMaterial({color:0x4f6e81,transparent:true,opacity:.72});
  const wind=new THREE.Mesh(new THREE.PlaneGeometry(1.5,.55),glass);wind.rotation.x=-.18;wind.position.set(0,1.38,.72);g.add(wind);
  const wheelMat=new THREE.MeshStandardMaterial({color:0x070707});
  [[-.98,.34,1.3],[.98,.34,1.3],[-.98,.34,-1.3],[.98,.34,-1.3]].forEach(([x,y,z])=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.33,.33,.22,16),wheelMat);w.rotation.z=Math.PI/2;w.position.set(x,y,z);g.add(w)});
  [-.65,.65].forEach(x=>{const l=new THREE.Mesh(new THREE.SphereGeometry(.11,8,8),new THREE.MeshBasicMaterial({color:0xffefb0}));l.position.set(x,.8,2.2);g.add(l);const pl=new THREE.PointLight(0xffe7a0,1.0,11);pl.position.set(x,.8,2.5);g.add(pl)});
  return g;
}
const cars=[];
for(let i=0;i<12;i++){

for(let i=0;i<7;i++){

for(const ax of [-31,31]){

    const alleyTex=crayon('#0b0b10',77+Math.abs(ax)+Math.abs(az));

    const weak=new THREE.PointLight(0x7d88a8,.5,8);weak.position.set(ax,4,az);street.add(weak);
  }
}

// EXTRA ROBBERIES
const robberies=[];

function graffitiTex(words,seed=1){
  const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');
  x.clearRect(0,0,512,256);
  let s=seed*991+7;const rnd=()=>((s=(s*9301+49297)%233280)/233280);
  const colors=['#ffffff','#d41422','#4f7cff','#7fd12a','#f0a31d','#a342d1'];
  for(let i=0;i<words.length;i++){
    x.save();
    x.translate(80+rnd()*350,45+rnd()*160);
    x.rotate((rnd()-.5)*.35);
    x.font=`900 ${36+Math.floor(rnd()*34)}px Arial`;
    x.lineWidth=3+rnd()*5;
    x.strokeStyle='#111';
    x.fillStyle=colors[(i+seed)%colors.length];
    x.strokeText(words[i],0,0);
    x.fillText(words[i],0,0);
    x.restore();
  }
  for(let i=0;i<28;i++){
    x.strokeStyle=colors[Math.floor(rnd()*colors.length)];
    x.lineWidth=2+rnd()*5;
    x.beginPath();x.moveTo(rnd()*512,rnd()*256);x.lineTo(rnd()*512,rnd()*256);x.stroke();
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

function nearestAgent(a,filter){
  let best=null,d=999;
  for(const b of agents){
    if(a===b || (filter&&!filter(b)))continue;
    const q=a.position.distanceTo(b.position);
    if(q<d){d=q;best=b;}
  }
  return {best,d};
}

  if(role==='dealer')pool=['idle','wander','sell','socialize'];
  if(role==='buyer')pool=['wander','buy','socialize','idle'];

}

}

  const f=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));

  if(want.lengthSq())want.normalize().multiplyScalar(keys.shift?13.0:8.2);
  vel.x=THREE.MathUtils.damp(vel.x,want.x,12,dt);vel.z=THREE.MathUtils.damp(vel.z,want.z,12,dt);

  if(mode==='street'){
    camera.position.x=Math.max(-50,Math.min(50,camera.position.x+vel.x*dt));
    camera.position.z=Math.max(-160,Math.min(24,camera.position.z+vel.z*dt));

    camera.position.z=Math.max(-6.6,Math.min(6.3,camera.position.z+vel.z*dt));
  }

  const moving=Math.hypot(vel.x,vel.z)>.2;if(moving)walkT+=dt*(keys.shift?16:11);
  camera.position.y=2.7+(moving?Math.sin(walkT)*.05:0);
  camera.quaternion.setFromEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));

    cars.forEach(c=>{c.position.z+=c.userData.speed*c.userData.dir*dt;if(c.position.z>24)c.position.z=-158;if(c.position.z<-158)c.position.z=24});

    });

    nightlife.forEach((h,i)=>{
      h.position.z=h.userData.baseZ+Math.sin(time*.45+h.userData.phase)*1.1;
      h.rotation.y=Math.sin(time*.35+h.userData.phase)*.45;
      h.userData.la.rotation.x=-.25+Math.sin(time*1.3+h.userData.phase)*.18;
    });

    homeless.forEach((h,i)=>{
      h.rotation.y=Math.sin(time*.22+h.userData.phase)*.18;
      h.userData.la.rotation.x=.7+Math.sin(time*.8+i)*.1;
      h.userData.ra.rotation.x=.8+Math.sin(time*.75+i)*.1;
    });

    // robbery state machine
    {
      const q=time%18;
      if(q<5){
        robber.position.z=THREE.MathUtils.lerp(-52,-47.3,q/5);
        robber.lookAt(victim.position.x,1.4,victim.position.z);
        animateWalk(robber,time,1.2);
        victim.userData.la.rotation.x=0;victim.userData.ra.rotation.x=0;
      }else if(q<10){
        robber.position.z=-47.3;
        robber.userData.ra.rotation.x=-1.45;
        victim.userData.la.rotation.x=-2.2;victim.userData.ra.rotation.x=-2.2;
      }else if(q<14){
        robber.position.z=THREE.MathUtils.lerp(-47.3,-61,(q-10)/4);
        animateWalk(robber,time,1.8);
      }else{
        robber.position.z=-61;
        victim.userData.la.rotation.x=0;victim.userData.ra.rotation.x=0;
      }
    }

    // fight
    fightA.lookAt(fightB.position.x,1.4,fightB.position.z);
    fightB.lookAt(fightA.position.x,1.4,fightA.position.z);
    fightA.userData.ra.rotation.x=-1.15+Math.sin(time*5.5)*.85;
    fightB.userData.la.rotation.x=-1.15+Math.sin(time*5.5+Math.PI)*.85;
    fightA.position.x=9+Math.sin(time*1.7)*.14;
    fightB.position.x=10.3+Math.sin(time*1.7+Math.PI)*.14;

    partyGroups.forEach((p,i)=>{
      p.group.forEach((h,j)=>{
        h.position.y=Math.abs(Math.sin(time*2.3+h.userData.phase))*0.06;
        h.rotation.y=Math.sin(time*1.2+h.userData.phase)*.55;
        h.userData.la.rotation.x=Math.sin(time*3+h.userData.phase)*.8;
        h.userData.ra.rotation.x=Math.sin(time*3+h.userData.phase+Math.PI)*.8;
      });
      p.L1.intensity=1.1+Math.abs(Math.sin(time*5+i))*2.2;
      p.L2.intensity=1.1+Math.abs(Math.sin(time*5+i+1.7))*2.2;
    });

    patrols.forEach((p,i)=>{
      p.c.position.z=p.c.userData.base+Math.sin(time*.2+p.c.userData.phase)*34;
      p.r.position.set(p.c.position.x-.55,2,p.c.position.z);
      p.b.position.set(p.c.position.x+.55,2,p.c.position.z);
      p.r.intensity=1+Math.sin(time*9+i)*1.8;
      p.b.intensity=1+Math.sin(time*9+i+Math.PI)*1.8;
    });

    // --- police search/chase AI ---
    criminals.forEach((c,i)=>{
      let nearestOfficer=null,dist=999;
      for(const o of searchOfficers){
        const d=o.position.distanceTo(c.position);
        if(d<dist){dist=d;nearestOfficer=o;}
      }

      if(dist<15){
        c.userData.state='flee';
        const away=c.position.clone().sub(nearestOfficer.position).setY(0).normalize();
        // add alley bias so criminals do not run only in straight lines
        away.x += Math.sin(time*1.7+c.userData.phase)*.35;
        away.normalize();
        c.userData.velocity.lerp(away.multiplyScalar(4.8),.08);
      }else{
        c.userData.state='loiter';
        const toHome=c.userData.home.clone().sub(c.position).setY(0);
        if(toHome.length()>4) c.userData.velocity.lerp(toHome.normalize().multiplyScalar(1.1),.04);
        else c.userData.velocity.lerp(new THREE.Vector3(Math.sin(time*.5+c.userData.phase),0,Math.cos(time*.45+c.userData.phase)).multiplyScalar(.5),.03);
      }
      c.position.addScaledVector(c.userData.velocity,dt);
      c.position.x=Math.max(-14,Math.min(14,c.position.x));
      c.position.z=Math.max(-150,Math.min(15,c.position.z));
      if(c.userData.velocity.length()>.4){
        c.rotation.y=Math.atan2(c.userData.velocity.x,c.userData.velocity.z);
        animateWalk(c,time,c.userData.state==='flee'?1.6:.7);
      }
    });

    searchOfficers.forEach((o,i)=>{
      if(!nearCamera(o,60) && aiFrame%2!==0)return;
      let target=null,dist=999;
      for(const c of criminals){
        const d=o.position.distanceTo(c.position);
        if(d<dist){dist=d;target=c;}
      }

      if(target && dist<19){
        o.userData.state='chase';
        const dir=target.position.clone().sub(o.position).setY(0).normalize();
        o.userData.velocity.lerp(dir.multiplyScalar(4.1),.09);
        // flashlight points toward suspect
        const localTarget=o.worldToLocal(target.position.clone());
        o.userData.flashTarget.position.copy(localTarget);
      }else{
        o.userData.state='patrol';
        const patrolPoint=o.userData.patrolCenter.clone();
        patrolPoint.z += Math.sin(time*.35+o.userData.phase)*9;
        const dir=patrolPoint.sub(o.position).setY(0);
        if(dir.length()>.4) o.userData.velocity.lerp(dir.normalize().multiplyScalar(1.6),.05);
        else o.userData.velocity.multiplyScalar(.9);
        o.userData.flashTarget.position.set(Math.sin(time*.4+i)*4,1.3,8);
      }

      o.position.addScaledVector(o.userData.velocity,dt);
      o.position.x=Math.max(-13,Math.min(13,o.position.x));
      o.position.z=Math.max(-150,Math.min(15,o.position.z));
      if(o.userData.velocity.length()>.25){
        o.rotation.y=Math.atan2(o.userData.velocity.x,o.userData.velocity.z);
        animateWalk(o,time,o.userData.state==='chase'?1.45:.8);
      }
    });

    // make active zones pulse subtly, enough to read bodies/faces
    activityLights.forEach((L,i)=>{
      L.intensity=.55+Math.sin(time*.55+i)*.12;
    });

    // producers play their own building's MPC continuously
    producerWindows.forEach((p,i)=>{
      const hit=Math.floor(time*(4.6+i*.08))%16;
      p.pads.forEach((pad,j)=>pad.scale.y=j===hit?2.0:1);
      p.prod.userData.la.rotation.x=-.72+Math.sin(time*6.4+i)*.48;
      p.prod.userData.ra.rotation.x=-.72+Math.sin(time*6.4+i+Math.PI)*.48;
      p.prod.position.y=Math.sin(time*3+i)*.025;
    });

    // citizens react to nearby crime/police instead of ignoring everything
    emotionalCitizens.forEach((c,i)=>{
      if(!nearCamera(c,45) && aiFrame%3!==0)return;
      const crime=nearestCrimeTo(c.position);
      let nearestCop=999;
      for(const o of searchOfficers) nearestCop=Math.min(nearestCop,c.position.distanceTo(o.position));

      if(crime.best && crime.dist<8){
        // scared civilians flee from crime
        const away=c.position.clone().sub(crime.best.position).setY(0).normalize();
        c.userData.velocity.lerp(away.multiplyScalar(3.2),.08);
      }else if(c.userData.role==='drunk'){
        const sway=new THREE.Vector3(
          Math.sin(time*.8+c.userData.phase),
          0,
          Math.cos(time*.55+c.userData.phase)
        ).multiplyScalar(.45);
        c.userData.velocity.lerp(sway,.04);
        c.rotation.z=Math.sin(time*1.1+c.userData.phase)*.08;
      }else if(c.userData.role==='homeless'){
        c.userData.velocity.multiplyScalar(.8);
        c.scale.y=.78;
      }else{
        const home=c.userData.home.clone().sub(c.position).setY(0);
        if(home.length()>5)c.userData.velocity.lerp(home.normalize().multiplyScalar(.9),.03);
        else c.userData.velocity.lerp(new THREE.Vector3(
          Math.sin(time*.25+c.userData.phase),0,
          Math.cos(time*.23+c.userData.phase)
        ).multiplyScalar(.22),.02);
      }

      c.position.addScaledVector(c.userData.velocity,dt);
      c.position.x=Math.max(-14,Math.min(14,c.position.x));
      c.position.z=Math.max(-150,Math.min(16,c.position.z));
      if(c.userData.velocity.length()>.25){
        c.rotation.y=Math.atan2(c.userData.velocity.x,c.userData.velocity.z);
        animateWalk(c,time,c.userData.velocity.length()>2?1.25:.55);
      }
    });


    // autonomous street agents: choose and execute tasks
    aiFrame++;
    agents.forEach((a,i)=>{
      if(!nearCamera(a,48) && aiFrame%3!==0)return;
      if(time>a.userData.taskUntil)chooseTask(a,time);
      const role=a.userData.role, task=a.userData.task;
      if(task!=='sleep')a.scale.y=THREE.MathUtils.lerp(a.scale.y,1,.08);

      // police reaction overrides normal behavior
      let nearestCop=null,copDist=999;
      for(const o of searchOfficers){
        const d=a.position.distanceTo(o.position);
        if(d<copDist){copDist=d;nearestCop=o;}
      }
      if((role==='thief'||role==='dealer') && copDist<7){
        a.userData.task='flee';a.userData.taskUntil=time+3;
      }

      if(task==='wander'){
        const wanderTarget=a.userData.home.clone();
        wanderTarget.x+=Math.sin(time*.35+a.userData.phase)*5;
        wanderTarget.z+=Math.cos(time*.29+a.userData.phase)*9;
        steerTowards(a,wanderTarget,1.1);
      }
      else if(task==='idle'){
        a.userData.velocity.multiplyScalar(.84);
      }
      else if(task==='socialize'||task==='watch'||task==='argue'){
        if(!a.userData.target){
          const q=nearestAgent(a,b=>b.userData.role!=='thief');
          a.userData.target=q.best;
        }
        if(a.userData.target){
          const d=a.position.distanceTo(a.userData.target.position);
          if(d>1.7)steerTowards(a,a.userData.target.position,1.2);
          else{
            a.userData.velocity.multiplyScalar(.72);
            a.lookAt(a.userData.target.position.x,1.4,a.userData.target.position.z);
            if(task==='argue'){
              a.userData.la.rotation.x=-.8+Math.sin(time*4+a.userData.phase)*.6;
              a.userData.ra.rotation.x=-.8+Math.sin(time*4+a.userData.phase+Math.PI)*.6;
            }
          }
        }
      }
      else if(task==='drink'){
        a.userData.velocity.multiplyScalar(.7);
        a.userData.ra.rotation.x=-1.8+Math.sin(time*2.5)*.12;
        a.rotation.z=Math.sin(time*.9+a.userData.phase)*.08;
      }
      else if(task==='sleep'){
        a.userData.velocity.multiplyScalar(.6);
        a.scale.y=.72;
        a.rotation.z=.18;
      }
      else if(task==='buy'){
        if(!a.userData.target){
          const q=nearestAgent(a,b=>b.userData.role==='dealer');
          a.userData.target=q.best;
        }
        if(a.userData.target){
          const d=a.position.distanceTo(a.userData.target.position);
          if(d>1.2)steerTowards(a,a.userData.target.position,1.5);
          else{
            a.userData.velocity.multiplyScalar(.55);
            a.lookAt(a.userData.target.position.x,1.4,a.userData.target.position.z);
            a.userData.ra.rotation.x=-1.15;
            a.userData.target.userData.ra.rotation.x=-1.15;
            a.userData.task='idle';a.userData.taskUntil=time+2.2;
            a.userData.target.userData.task='idle';a.userData.target.userData.taskUntil=time+2.2;
          }
        }
      }
      else if(task==='sell'){
        if(!a.userData.target){
          const q=nearestAgent(a,b=>b.userData.role==='buyer');
          a.userData.target=q.best;
        }
        if(a.userData.target){
          const d=a.position.distanceTo(a.userData.target.position);
          if(d>1.4)steerTowards(a,a.userData.target.position,1.1);
          else{
            a.userData.velocity.multiplyScalar(.6);
            a.lookAt(a.userData.target.position.x,1.4,a.userData.target.position.z);
            a.userData.ra.rotation.x=-1.1;
          }
        }
      }
      else if(task==='steal'){
        if(!a.userData.target){
          const q=nearestAgent(a,b=>['civilian','buyer'].includes(b.userData.role));
          a.userData.target=q.best;
        }
        if(a.userData.target){
          const d=a.position.distanceTo(a.userData.target.position);
          if(d>1.3)steerTowards(a,a.userData.target.position,2.0);
          else{
            a.lookAt(a.userData.target.position.x,1.4,a.userData.target.position.z);
            a.userData.ra.rotation.x=-1.35;
            a.userData.target.userData.la.rotation.x=-2.0;
            a.userData.target.userData.ra.rotation.x=-2.0;
            a.userData.task='flee';a.userData.taskUntil=time+4;
          }
        }
      }
      else if(task==='flee'){
        let threat=nearestCop?nearestCop.position:null;
        if(!threat&&a.userData.target)threat=a.userData.target.position;
        if(threat){
          const away=a.position.clone().sub(threat).setY(0).normalize();
          away.x+=Math.sin(time*2+a.userData.phase)*.25;away.normalize();
          a.userData.velocity.lerp(away.multiplyScalar(4.4),.12);
        }
      }

      a.position.addScaledVector(a.userData.velocity,dt);
      a.position.x=Math.max(-14,Math.min(14,a.position.x));
      a.position.z=Math.max(-150,Math.min(16,a.position.z));

      if(a.userData.velocity.length()>.2){
        a.rotation.y=Math.atan2(a.userData.velocity.x,a.userData.velocity.z);
        animateWalk(a,time,a.userData.velocity.length()>2?1.45:.7);
      }
    });

    // arrest behavior: if an officer gets very close, suspect yields briefly
    criminals.forEach((c,i)=>{
      let closest=null,d=999;
      for(const o of searchOfficers){
        const q=o.position.distanceTo(c.position);
        if(q<d){d=q;closest=o;}
      }
      if(d<1.7){
        c.userData.velocity.multiplyScalar(.15);
        c.userData.la.rotation.x=-2.0;
        c.userData.ra.rotation.x=-2.0;
        c.userData.state='arrested';
      }else if(c.userData.state==='arrested' && d>4){
        c.userData.state='flee';
      }
    });

    robberies.forEach((r,i)=>{
      const q=(time+r.phase)%17;
      if(q<4){
        r.rb.position.z=THREE.MathUtils.lerp(r.z-5,r.z-1.3,q/4);
        r.rb.lookAt(r.vt.position.x,1.4,r.vt.position.z);
        animateWalk(r.rb,time,1.1);
        r.vt.userData.la.rotation.x=0;r.vt.userData.ra.rotation.x=0;
      }else if(q<9){
        r.rb.position.z=r.z-1.3;
        r.rb.userData.ra.rotation.x=-1.45;
        r.vt.userData.la.rotation.x=-2.15;r.vt.userData.ra.rotation.x=-2.15;
      }else if(q<13){
        r.rb.position.z=THREE.MathUtils.lerp(r.z-1.3,r.z-12,(q-9)/4);
        animateWalk(r.rb,time,1.7);
      }else{
        r.rb.position.z=r.z-12;
        r.vt.userData.la.rotation.x=0;r.vt.userData.ra.rotation.x=0;
      }
    });

    extraOfficers.forEach((h,i)=>{
      if(h.userData.baseZ!==undefined){
        h.position.z=h.userData.baseZ+Math.sin(time*.45+h.userData.phase)*7;
        animateWalk(h,time,.8);
      }
    });

    extraFights.forEach((f,i)=>{
      f.a.lookAt(f.b.position.x,1.4,f.b.position.z);
      f.b.lookAt(f.a.position.x,1.4,f.a.position.z);
      f.a.userData.ra.rotation.x=-1.1+Math.sin(time*5.2+f.phase)*.9;
      f.b.userData.la.rotation.x=-1.1+Math.sin(time*5.2+f.phase+Math.PI)*.9;
    });

    // looping visible car chase
    chaseCar.position.z += 10.5*dt;
    chasePolice.position.z += 11.2*dt;
    if(chaseCar.position.z>20) chaseCar.position.z=-150;
    if(chasePolice.position.z>20) chasePolice.position.z=-160;
    chaseRed.position.set(chasePolice.position.x-.55,2,chasePolice.position.z);
    chaseBlue.position.set(chasePolice.position.x+.55,2,chasePolice.position.z);
    chaseRed.intensity=1.1+Math.sin(time*10)*2.4;
    chaseBlue.intensity=1.1+Math.sin(time*10+Math.PI)*2.4;

    lamps.forEach(l=>{
      if(l.flicker){
        const burst=(Math.sin(time*13+l.phase)>.22)||(Math.sin(time*3.2+l.phase)>.83);
        l.L.intensity=burst?3.6:.12;l.bulb.material.color.set(burst?0xffd078:0x40382e);
      }else l.L.intensity=2.9+Math.sin(time*.6+l.phase)*.22;
    });

    const n=nearestBuilding();
    if(n.best&&n.d<11){track.querySelector('b').textContent=n.best.userData.name;track.querySelector('span').textContent='E · ENTRAR · 5 PISOS';track.style.opacity=1;prompt.textContent='E · ENTRAR';prompt.style.opacity=n.d<6.8?1:0}
    else{track.style.opacity=0;prompt.style.opacity=0}
  }else{
    prompt.textContent='E · SALIR';prompt.style.opacity=1;
    if(producer){
      const hit=Math.floor(time*5.5)%16;producer.pads.forEach((p,i)=>p.scale.y=i===hit?1.9:1);
      producer.prod.userData.la.rotation.x=-.75+Math.sin(time*6.5)*.45;
      producer.prod.userData.ra.rotation.x=-.75+Math.sin(time*6.5+Math.PI)*.45;
    }
  }

  renderer.render(scene,camera);
}
animate(performance.now());

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
