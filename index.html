<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BREAKIN SOULS — WORLD V3</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#ece8df;font-family:Arial,Helvetica,sans-serif}
canvas{display:block}
#ui{position:fixed;inset:0;z-index:20;pointer-events:none;color:#111}
#gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#eee9df;pointer-events:auto;transition:opacity .7s}
#gate .box{text-align:center;padding:28px}
#gate h1{font-size:clamp(44px,9vw,104px);margin:0;color:#a70d12;letter-spacing:.05em;text-shadow:2px 2px 0 #5e0508}
#gate p{color:#176d34;font-weight:700;font-size:clamp(18px,3vw,36px);margin:8px 0 24px}
#enter{pointer-events:auto;background:transparent;border:3px solid #111;color:#111;padding:14px 24px;font-weight:700;letter-spacing:.18em;cursor:pointer}
#chapter{position:absolute;top:16px;left:16px;font-size:12px;font-weight:700;letter-spacing:.18em}
#track{position:absolute;left:50%;top:6%;transform:translateX(-50%);text-align:center;opacity:0;transition:.3s}
#track .name{font-size:clamp(24px,4vw,48px);font-weight:800;color:#9f0f14;text-shadow:2px 2px 0 rgba(0,0,0,.12)}
#track .sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-top:4px}
#hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;letter-spacing:.12em;text-align:center}
#sound{position:absolute;right:16px;top:16px;pointer-events:auto;background:#eee9df;border:2px solid #111;color:#111;padding:8px 10px;font-weight:700}
#event{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);font-size:14px;font-weight:800;background:rgba(238,233,223,.82);padding:7px 10px;border:2px solid #111;opacity:0;transition:.25s}
</style>
</head>
<body>
<div id="ui">
  <div id="gate"><div class="box"><h1>BREAKIN SOULS</h1><p>No One Else</p><button id="enter">ENTRAR</button></div></div>
  <div id="chapter">BREAKIN SOULS · CRAYON CITY</div>
  <div id="track"><div class="name"></div><div class="sub"></div></div>
  <button id="sound">AUDIO: OFF</button>
  <div id="event"></div>
  <div id="hint">WASD / RUEDA · MOUSE PARA MIRAR · ACÉRCATE A LOS EDIFICIOS</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xeee9df);
scene.fog=new THREE.FogExp2(0xeee9df,.012);

const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,240);
camera.position.set(0,3,18);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x6b5d59,1.35));
const light=new THREE.DirectionalLight(0xffffff,1.2);light.position.set(-7,18,8);scene.add(light);

function crayonTexture(base, strokes=80, seed=0){
  const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,256,256);
  let s=seed+1;
  function rnd(){s=(s*9301+49297)%233280;return s/233280}
  for(let i=0;i<strokes;i++){
    x.strokeStyle=`rgba(20,20,20,${0.05+rnd()*.12})`;
    x.lineWidth=1+rnd()*3;
    x.beginPath();
    x.moveTo(rnd()*256,rnd()*256);
    x.lineTo(rnd()*256,rnd()*256);
    x.stroke();
  }
  for(let i=0;i<strokes*.7;i++){
    x.strokeStyle=`rgba(255,255,255,${0.03+rnd()*.08})`;
    x.lineWidth=1+rnd()*2;
    x.beginPath();
    x.moveTo(rnd()*256,rnd()*256);
    x.lineTo(rnd()*256,rnd()*256);
    x.stroke();
  }
  return new THREE.CanvasTexture(c);
}

function paperTexture(){
  const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');
  x.fillStyle='#eee9df';x.fillRect(0,0,512,512);
  for(let i=0;i<180;i++){
    x.strokeStyle=`rgba(70,70,70,${0.03+Math.random()*.06})`;
    x.lineWidth=.5+Math.random()*1.5;
    x.beginPath();
    x.moveTo(Math.random()*512,Math.random()*512);
    x.lineTo(Math.random()*512,Math.random()*512);
    x.stroke();
  }
  return new THREE.CanvasTexture(c);
}
const paper=paperTexture();
paper.wrapS=paper.wrapT=THREE.RepeatWrapping;paper.repeat.set(8,20);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(70,170),new THREE.MeshStandardMaterial({map:paper,color:0xd8d2c8,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.z=-62;scene.add(ground);

const roadTex=crayonTexture('#9e9a95',140,8);roadTex.wrapS=roadTex.wrapT=THREE.RepeatWrapping;roadTex.repeat.set(3,20);
const road=new THREE.Mesh(new THREE.PlaneGeometry(18,165),new THREE.MeshStandardMaterial({map:roadTex,roughness:1}));
road.rotation.x=-Math.PI/2;road.position.set(0,.01,-62);scene.add(road);

for(let i=0;i<22;i++){
  const dash=new THREE.Mesh(new THREE.PlaneGeometry(.18,3.4),new THREE.MeshBasicMaterial({color:0xbe141b}));
  dash.rotation.x=-Math.PI/2;dash.position.set(0,.02,10-i*7.2);scene.add(dash);
}

function textTexture(text,color='#111',accent='#c70f18'){
  const c=document.createElement('canvas');c.width=512;c.height=180;const x=c.getContext('2d');
  x.clearRect(0,0,c.width,c.height);
  x.font='bold 56px Arial';x.textAlign='center';x.textBaseline='middle';
  x.fillStyle=color;x.fillText(text,256,90);
  for(let i=0;i<28;i++){
    x.strokeStyle=i%2?accent:'#222';x.lineWidth=2+Math.random()*4;
    x.beginPath();x.moveTo(Math.random()*512,Math.random()*180);x.lineTo(Math.random()*512,Math.random()*180);x.stroke();
  }
  return new THREE.CanvasTexture(c);
}

function makeCharacterSprite(scale=1){
  const c=document.createElement('canvas');c.width=256;c.height=384;const x=c.getContext('2d');
  x.clearRect(0,0,256,384);
  x.lineCap='round';x.lineJoin='round';

  x.strokeStyle='#5e351e';x.fillStyle='#8f5830';x.lineWidth=7;
  x.beginPath();x.arc(128,92,58,0,Math.PI*2);x.fill();x.stroke();

  x.strokeStyle='#111';x.lineWidth=8;
  [[100,75],[156,75]].forEach(([cx,cy])=>{
    x.beginPath();x.moveTo(cx-12,cy-12);x.lineTo(cx+12,cy+12);x.stroke();
    x.beginPath();x.moveTo(cx+12,cy-12);x.lineTo(cx-12,cy+12);x.stroke();
  });
  x.beginPath();x.moveTo(103,118);x.lineTo(153,118);x.stroke();

  x.strokeStyle='#68a814';x.fillStyle='#7fc420';x.lineWidth=7;
  x.beginPath();x.moveTo(94,150);x.lineTo(160,150);x.lineTo(171,245);x.lineTo(84,245);x.closePath();x.fill();x.stroke();

  x.strokeStyle='#4b1ea0';x.fillStyle='#6840c7';
  x.fillRect(85,244,35,62);x.strokeRect(85,244,35,62);x.fillRect(136,244,35,62);x.strokeRect(136,244,35,62);

  x.strokeStyle='#1a63cb';x.fillStyle='#2f7ceb';x.lineWidth=6;
  x.fillRect(74,306,52,17);x.strokeRect(74,306,52,17);x.fillRect(132,306,52,17);x.strokeRect(132,306,52,17);

  // arms
  x.strokeStyle='#8f5830';x.lineWidth=9;
  x.beginPath();x.moveTo(92,172);x.lineTo(55,240);x.stroke();
  x.beginPath();x.moveTo(163,173);x.lineTo(195,235);x.stroke();

  return new THREE.CanvasTexture(c);
}
const charTex=makeCharacterSprite();

function makeMPCSprite(){
  const c=document.createElement('canvas');c.width=300;c.height=220;const x=c.getContext('2d');
  x.fillStyle='#ddd';x.fillRect(0,0,300,220);
  x.strokeStyle='#111';x.lineWidth=8;x.strokeRect(14,14,272,192);
  x.fillStyle='#173f86';x.fillRect(45,35,90,35);x.strokeRect(45,35,90,35);
  for(let r=0;r<4;r++)for(let col=0;col<4;col++){
    x.fillStyle=['#d1262f','#d83a22','#c3131d','#e04b27'][(r+col)%4];
    x.fillRect(50+col*38,90+r*28,28,20);x.strokeRect(50+col*38,90+r*28,28,20);
  }
  for(let i=0;i<4;i++){x.beginPath();x.arc(235,80+i*32,11,0,Math.PI*2);x.stroke();}
  return new THREE.CanvasTexture(c);
}
const mpcTex=makeMPCSprite();

function sprite(tex,x,y,z,w,h){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));
  m.position.set(x,y,z);scene.add(m);return m;
}

const buildings=[];
const palette=[
  ['#6428b8',0x6428b8],['#e56b17',0xe56b17],['#2076d2',0x2076d2],['#e6469c',0xe6469c],['#dbc31c',0xdbc31c]
];

function building(x,z,w,h,color,title,sub,seed){
  const tex=crayonTexture(color,180,seed);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(1,2);
  const box=new THREE.Mesh(new THREE.BoxGeometry(w,h,7),new THREE.MeshStandardMaterial({map:tex,roughness:1}));
  box.position.set(x,h/2,z);scene.add(box);
  box.userData={title,sub};

  const edge=new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry),new THREE.LineBasicMaterial({color:0x191919}));
  edge.position.copy(box.position);scene.add(edge);

  const sign=new THREE.Mesh(new THREE.PlaneGeometry(w*.86,1.6),new THREE.MeshBasicMaterial({map:textTexture(title),transparent:true}));
  sign.position.set(x,2.2,z+3.53);scene.add(sign);

  for(let yy=4;yy<h-1;yy+=2.5){
    for(let xx=-w/2+1;xx<w/2-.4;xx+=1.5){
      const win=new THREE.Mesh(new THREE.PlaneGeometry(.75,.9),new THREE.MeshBasicMaterial({color:Math.random()>.45?0xf0cc22:0x6ec6ef}));
      win.position.set(x+xx,yy,z+3.54);scene.add(win);
    }
  }

  // recurring character + MPC on facade
  const ch=sprite(charTex,x-w*.17,3.0,z+3.58,1.55,2.3);
  const mp=sprite(mpcTex,x+w*.12,2.2,z+3.6,1.8,1.25);
  ch.userData.bob=Math.random()*10; mp.userData.bob=Math.random()*10;

  buildings.push(box);
  return {box,ch,mp};
}

const B1=building(-12,-7,7.5,10,palette[0][0],'NUMB AGAIN','BEAT 01 · BLOCK',1);
const B2=building(12,-28,8.5,13,palette[1][0],'BEAUTIFUL POISON','BEAT 02 · BAR',2);
const B3=building(-12,-51,9,15,palette[2][0],'CHASING THE NIGHT','BEAT 03 · CLUB',3);
const B4=building(12,-76,9,12,palette[3][0],"A FATHER'S SHADOW",'BEAT 04 · STREET',4);
const B5=building(-12,-101,10,14,palette[4][0],'THE DAY I BECAME HOME','BEAT 05 · HOME',5);

function pole(x,z){
  const mat=new THREE.MeshStandardMaterial({map:crayonTexture('#8a4b12',80,Math.floor(Math.random()*100)),roughness:1});
  const p=new THREE.Mesh(new THREE.CylinderGeometry(.13,.18,7,6),mat);p.position.set(x,3.5,z);scene.add(p);
  return p;
}
const poles=[];
for(let i=0;i<9;i++){poles.push(pole(-7.5,4-i*14));poles.push(pole(7.5,-3-i*14));}
for(let i=0;i<poles.length-2;i+=2){
  const a=poles[i].position,b=poles[i+2].position;
  const pts=[];for(let j=0;j<=14;j++){const t=j/14;pts.push(new THREE.Vector3(a.x*(1-t)+b.x*t,6.6-Math.sin(t*Math.PI)*1.3,a.z*(1-t)+b.z*t));}
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0x222222})));
}

function crow(x,y,z){
  const c=document.createElement('canvas');c.width=140;c.height=90;const q=c.getContext('2d');
  q.strokeStyle='#050505';q.lineWidth=9;q.lineCap='round';
  q.beginPath();q.moveTo(18,45);q.quadraticCurveTo(50,5,72,42);q.quadraticCurveTo(95,5,123,43);q.stroke();
  const tex=new THREE.CanvasTexture(c);return sprite(tex,x,y,z,1.4,.9);
}
const crows=[];for(let i=0;i<12;i++)crows.push(crow((Math.random()-.5)*26,5+Math.random()*7,-Math.random()*120+10));

function simpleNPC(x,z,type=0){
  const g=new THREE.Group();
  const col=['#252525','#5d401f','#7a1630','#315c28','#4d347b'][type%5];
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.15,.22,1.15,6),new THREE.MeshStandardMaterial({color:col}));body.position.y=.8;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.18,10,10),new THREE.MeshStandardMaterial({color:0x8c5b3d}));head.position.y=1.52;g.add(head);
  g.position.set(x,0,z);g.userData={speed:.007+Math.random()*.014,phase:Math.random()*10,type};scene.add(g);return g;
}
const npcs=[];
for(let i=0;i<34;i++)npcs.push(simpleNPC((Math.random()>.5?1:-1)*(6.5+Math.random()*5),-5-Math.random()*112,i));

function policeCar(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.8,.7,4.8),new THREE.MeshStandardMaterial({color:0xf2f2ef}));body.position.y=.7;g.add(body);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(2.1,.55,2.1),new THREE.MeshStandardMaterial({color:0xe7e7e3}));roof.position.y=1.25;g.add(roof);
  const label=sprite(textTexture('CARABINEROS DE CHILE','#176b34','#176b34'),0,1.05,2.42,2.3,.75);g.add(label);
  g.position.set(5.5,0,-63);scene.add(g);
  const red=new THREE.PointLight(0xff1828,2.8,11),blue=new THREE.PointLight(0x176cff,2.8,11);red.position.set(4.9,2,-63);blue.position.set(6.1,2,-63);scene.add(red,blue);
  return {g,red,blue};
}
const cop=policeCar();

function bottle(x,z){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(.07,.11,.58,8),new THREE.MeshStandardMaterial({color:0x5b381d}));
  m.position.set(x,.3,z);m.rotation.z=(Math.random()-.5)*1.2;scene.add(m);
}
for(let i=0;i<18;i++)bottle((Math.random()>.5?1:-1)*(5+Math.random()*7),-10-Math.random()*105);

function weaponProp(x,z){
  const g=new THREE.Group();
  const a=new THREE.Mesh(new THREE.BoxGeometry(.65,.12,.14),new THREE.MeshStandardMaterial({color:0x111111}));g.add(a);
  const b=new THREE.Mesh(new THREE.BoxGeometry(.18,.45,.13),new THREE.MeshStandardMaterial({color:0x5b351f}));b.position.set(.18,-.23,0);b.rotation.z=.25;g.add(b);
  g.position.set(x,.16,z);g.rotation.y=Math.random()*Math.PI;scene.add(g);
}
weaponProp(6.8,-44);weaponProp(-7.2,-86);

const redRainGeo=new THREE.BufferGeometry(),rpts=[];
for(let i=0;i<520;i++)rpts.push((Math.random()-.5)*38,Math.random()*18,-Math.random()*130+15);
redRainGeo.setAttribute('position',new THREE.Float32BufferAttribute(rpts,3));
const redRain=new THREE.Points(redRainGeo,new THREE.PointsMaterial({color:0xb90f15,size:.045,transparent:true,opacity:.48}));
scene.add(redRain);

let entered=false,targetZ=18,mx=0,my=0,keys={};
addEventListener('mousemove',e=>{mx=e.clientX/innerWidth*2-1;my=-(e.clientY/innerHeight)*2+1});
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('wheel',e=>{if(entered)targetZ=THREE.MathUtils.clamp(targetZ+e.deltaY*.018,-112,18)},{passive:true});
let ty=0;addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true});
addEventListener('touchmove',e=>{const t=e.touches[0];targetZ=THREE.MathUtils.clamp(targetZ+(t.clientY-ty)*.05,-112,18);ty=t.clientY},{passive:true});

const track=document.getElementById('track');
function nearestBuilding(){
  let best=null,d=999;
  for(const b of buildings){const q=Math.abs(camera.position.z-b.position.z);if(q<d){d=q;best=b}}
  return {best,d};
}
function showTrack(b,on){
  track.querySelector('.name').textContent=b?b.userData.title:'';
  track.querySelector('.sub').textContent=b?b.userData.sub:'';
  track.style.opacity=on?1:0;
}
const eventBox=document.getElementById('event');
function flashEvent(txt){
  eventBox.textContent=txt;eventBox.style.opacity=1;clearTimeout(flashEvent.t);flashEvent.t=setTimeout(()=>eventBox.style.opacity=0,1500);
}

let ctx=null,master=null,audioOn=false,loops=[];
function tone(freq,type){
  const g=ctx.createGain();g.gain.value=0;g.connect(master);
  const o=ctx.createOscillator();o.frequency.value=freq;o.type=type;o.connect(g);o.start();return g;
}
async function initAudio(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain();master.gain.value=.45;master.connect(ctx.destination);
  loops=[tone(55,'sine'),tone(65.4,'square'),tone(73.4,'sawtooth'),tone(82.4,'triangle'),tone(98,'sine')];
}
function updateAudio(){
  if(!ctx||!audioOn)return;
  const n=nearestBuilding();let idx=buildings.indexOf(n.best);
  loops.forEach((g,i)=>g.gain.setTargetAtTime(i===idx&&n.d<16?.03*(1-n.d/16):0,ctx.currentTime,.18));
}

document.getElementById('enter').onclick=()=>{entered=true;const g=document.getElementById('gate');g.style.opacity=0;setTimeout(()=>g.style.display='none',700)};
document.getElementById('sound').onclick=async e=>{await initAudio();audioOn=!audioOn;if(audioOn)await ctx.resume();else await ctx.suspend();e.target.textContent='AUDIO: '+(audioOn?'ON':'OFF')};

let lastEvent=0;
function animate(t){
  requestAnimationFrame(animate);
  const time=t*.001;
  if(keys['w'])targetZ-=.32;if(keys['s'])targetZ+=.32;
  targetZ=THREE.MathUtils.clamp(targetZ,-112,18);

  camera.position.z+=(targetZ-camera.position.z)*.042;
  camera.position.x+=(mx*2.0-camera.position.x)*.03;
  camera.position.y+=(3+my*.55-camera.position.y)*.03;
  camera.lookAt(mx*2,2.3+my*.3,camera.position.z-13);

  redRain.position.y-=.08;if(redRain.position.y<-9)redRain.position.y=10;

  crows.forEach((c,i)=>{c.position.x+=Math.sin(time*1.3+i)*.004;c.position.y+=Math.sin(time*1.8+i)*.003;});
  [B1,B2,B3,B4,B5].forEach((b,i)=>{b.ch.position.y=3.0+Math.sin(time*2+i)*.05;b.mp.rotation.z=Math.sin(time*1.7+i)*.03;});

  npcs.forEach((n,i)=>{
    n.position.z+=Math.sin(time*n.userData.speed*80+n.userData.phase)*.006;
    n.position.x+=Math.sin(time*.8+n.userData.phase)*.0025;
    n.rotation.y=Math.sin(time*.5+n.userData.phase)*.45;
  });

  cop.red.intensity=1.1+Math.sin(time*8)*1.6;
  cop.blue.intensity=1.1+Math.sin(time*8+Math.PI)*1.6;

  const n=nearestBuilding();showTrack(n.best,n.d<18);updateAudio();

  if(time-lastEvent>6 && Math.random()<.012){
    const events=['pelea en la esquina','sirena al fondo','botella quebrándose','gente saliendo del bar','un cuervo cruza la calle','alguien corre entre los edificios'];
    flashEvent(events[Math.floor(Math.random()*events.length)]);lastEvent=time;
  }

  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
